# Cloudflare Pages 用（Git 連携時、ビルド成果物ディレクトリのヒント）
# https://developers.cloudflare.com/pages/functions/wrangler-configuration/
#
# name は Cloudflare ダッシュボード上のプロジェクト名と一致させる。
# compatibility_date のみで name が無いと、環境によってデプロイ検証で失敗することがある。

name = "yamagata-kids-map"
compatibility_date = "2025-05-15"
pages_build_output_dir = "out"
